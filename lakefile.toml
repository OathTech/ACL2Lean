name = "ACL2Lean"
version = "0.1.0"
defaultTargets = ["acl2lean", "Tests"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "ACL2Lean"

[[lean_lib]]
name = "Tests"
# D2 (2026-08-08): the usefi discharge composition legitimately nests a
# parametric replay inside a row replay; withLocalDecls spends a native
# frame per telescope binder and the default worker stack overflows
# (the CLI main thread survives the same work). 512MB thread stacks for
# the test lib until the compositional-replay pilot (the long-term
# note) removes the depth. moreLeanArgs applies to these modules only.
moreLeanArgs = ["--tstack=524288"]

[[lean_exe]]
name = "acl2lean"
root = "Main"

# The FOCUSED replay CLI (perf arc WP1): minimal import cone (Runner →
# Driver, no Imported/ catalog, no Tests), logs read from disk at runtime.
# supportInterpreter: the driver evaluates tactic syntax (dpLeafTactic)
# against the imported environment.
[[lean_exe]]
name = "acl2lean-replay"
root = "ReplayMain"
supportInterpreter = true
