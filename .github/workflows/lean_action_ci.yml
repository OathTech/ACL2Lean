name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The proof-log corpus is gitignored (see .gitignore) but `include_str`'d by the
# main ACL2Lean library AND the test suite, so a clean checkout cannot `lake build`
# until the logs are regenerated. Regenerating them requires running ACL2, whose
# `saved_acl2.core` image is a large, host-specific binary that is NOT tracked in
# the submodule. So CI must: build ACL2 from source (cached), capture the logs,
# then run the Lean conformance gate (`just ci`).
jobs:
  build:
    runs-on: ubuntu-latest

    # Pin the shell for every `run:` block to bash under strict mode, so a
    # snippet's behavior does not depend on the runner's default shell — and
    # matches what a developer gets from our `#!/usr/bin/env bash` scripts.
    # `-e` errexit, `-u` nounset, `-o pipefail`: a failing command (or a
    # failing stage of a pipe, or an unset var) aborts the step instead of
    # limping on. GitHub's default `bash` already adds `-e`; we make `-u`/
    # pipefail explicit too, and guarantee bash builtins (the capture step's
    # `mapfile` into an array relies on it).
    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - name: Checkout (with acl2 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl
          sbcl --version

      # The ACL2 core image is non-portable (it bakes in the SBCL path/version —
      # this is exactly why the repo's checked-out image cannot be reused across
      # machines). Key the cache on (OS, SBCL version, acl2 submodule SHA): any
      # of those changing invalidates the built image and forces a rebuild.
      - name: ACL2 submodule SHA
        id: acl2sha
        run: echo "sha=$(git -C acl2 rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: SBCL version
        id: sbcl
        run: echo "ver=$(sbcl --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache ACL2 build
        id: acl2cache
        uses: actions/cache@v6
        with:
          path: |
            acl2/saved_acl2
            acl2/saved_acl2.core
          key: acl2-${{ runner.os }}-${{ steps.sbcl.outputs.ver }}-${{ steps.acl2sha.outputs.sha }}

      - name: Build ACL2 (only on cache miss)
        if: steps.acl2cache.outputs.cache-hit != 'true'
        run: |
          make -C acl2 LISP=sbcl
          test -x acl2/saved_acl2

      - name: Capture proof-log corpus from ACL2
        run: |
          # The .proof-log corpus is gitignored and `include_str`'d at build
          # time, so it MUST be regenerated on the runner. TWO derived demand
          # sets, NO hardcoded lists (audit 2026-07-26 F0: the derivation
          # below existed for sorting/ only — a clone hazard: pattern-tests
          # include_str refs landed 2026-07-25 and killed this step, and
          # check-pattern-map's logs-present check has needed the whole
          # pattern corpus since 2026-07-23; remote CI was RED for four
          # merges while local `just ci` — run after a developer
          # recapture-all — stayed green):
          #
          #   1. every acl2_samples/**/*.lisp book that lives IN THE REPO
          #      (simple, recon-tests, pattern-tests) — check-pattern-map
          #      requires a log for every pattern book, not just the
          #      include_str'd ones, so the demand is the directory itself;
          #   2. the sorting books DERIVED from include_str references
          #      (sorting sources live in the acl2 submodule, not the repo;
          #      we deliberately do NOT capture the whole books.txt manifest
          #      — see the note below on foreign system books).
          mapfile -t repo_books < <(git ls-files 'acl2_samples/*.lisp' | sort)
          echo "Repo books to capture (git-tracked .lisp under acl2_samples):"
          printf '  %s\n' "${repo_books[@]}"
          ./scripts/capture-proof-log.sh "${repo_books[@]}"
          # acl2_samples/sorting/ holds only gitignored logs, so git (which does not
          # track empty dirs) omits it from a clean checkout — create it for OUTDIR.
          mkdir -p acl2_samples/sorting
          # DERIVE the sorting books to capture from the corpus's own include_str
          # references, rather than a hardcoded list (a stale hardcoded list is
          # exactly what let isort's log go uncaptured). This picks up any new
          # sorting book the moment it's added to a Lean source, and captures
          # ONLY what's needed — we still do not capture the whole
          # books.txt manifest (orderedp/how-many are defun-only, out of
          # the coverage corpus by design). The old caveat that
          # qsort/equisort/sorts-equivalent "can't be ld'd uncertified"
          # (foreign arithmetic-3 includes) is STALE: this workflow has
          # been capturing qsort/equisort successfully — the fork's ld
          # resolves :dir :system includes against the submodule tree.
          # Sibling includes WITHIN sorting/ (e.g. isort→perm) do resolve
          # uncertified relative to the book dir, so `ld` loads them on the fly.
          # Build a proper array (mapfile reads line-by-line, no dependence on
          # IFS/glob word-splitting), then expand "${books[@]}" — robust and
          # shellcheck-clean, unlike an unquoted $var of space-joined paths.
          # UNION of two reference styles (fix-forward 2026-08-07: the
          # per-book coverage modules read logs via covLogPath's COMPUTED
          # paths — invisible to the include_str grep; sorts-equivalent
          # was referenced ONLY that way and its capture was skipped,
          # caught by check-proof-logs' A5 preflight):
          #   1. include_str references (as before);
          #   2. the coverage corpus's sorting books, from corpusOrder in
          #      Tests/Coverage/Harness.lean — the SAME source the local
          #      preflight derives from, so the two lists cannot desync.
          mapfile -t logs < <( { git grep -h 'include_str "[^"]*sorting/[^"]*proof-log"' -- '*.lean' \
                                | grep -oE 'sorting/[a-z0-9-]+\.proof-log'; \
                                awk '/def corpusOrder/,/\]/' Tests/Coverage/Harness.lean \
                                | grep -o '"sorting/[^"]*"' | tr -d '"' \
                                | sed 's|$|.proof-log|'; } | sort -u)
          books=()
          for l in "${logs[@]}"; do books+=("acl2/books/${l%.proof-log}.lisp"); done
          echo "Sorting books to capture (derived from include_str refs):"
          printf '  %s\n' "${books[@]}"
          OUTDIR=acl2_samples/sorting ./scripts/capture-proof-log.sh "${books[@]}"
          echo "Captured logs:"
          find acl2_samples -name '*.proof-log' | sort
          # Fail HERE (not deep in the Lean build) if any include_str'd log is
          # still missing after capture — the same preflight `just ci` runs.
          # (check-pattern-map, inside `just ci` later, then verifies the
          # WHOLE pattern corpus has logs — demand set 1 above.)
          ./scripts/check-proof-logs.sh

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Cache the DEPENDENCY packages (Mathlib et al.). `lake exe cache get` only
      # fetches Mathlib's .olean files, NOT the native .c->.o compilation — and since
      # we build an executable, Lake natively compiles Mathlib's whole import closure
      # (~2800 .o files, ~11min) from scratch otherwise. We cache the WHOLE package
      # dir (source + .git + .lake/build), not just the build subdir: a build dir
      # without its source clone fails Lake's manifest check ("URL has changed"), so
      # Lake deletes and re-clones the package, wiping the restored build. Keyed on
      # the toolchain + manifest (which pin exact dep revisions), so it invalidates
      # only when deps change, never on our own source. We deliberately do NOT cache
      # our own .lake/build: it rebuilds fast, and a restored copy would resurrect the
      # stale embedded proof-logs that capture-proof-log.sh force-invalidates.
      - name: Cache Lean dependency build
        uses: actions/cache@v6
        with:
          path: .lake/packages
          # Key on (arch, toolchain, manifest): .o files are arch- and
          # toolchain-specific, and the manifest pins exact dep revisions. The
          # restore-key fallback (manifest dropped) lets a dep bump reuse the
          # prior cache and incrementally re-link, instead of a cold full rebuild.
          key: lean-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            lean-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-

      - name: Get Mathlib build cache
        run: lake exe cache get

      # `just ci` = lake build + lake build Tests + lake build Tests.DriverCoverage.
      # The unit tests are compile-time `#guard`s, so building the Tests library IS
      # the test run; DriverCoverage is the replay-coverage scoreboard.
      - name: Install just
        uses: extractions/setup-just@v4

      # shellcheck lints the build scripts (`just lint-sh`, part of `just ci`).
      # ubuntu-latest ships it, but install explicitly so the gate never depends
      # on the runner image — and `just lint-sh` would silently skip if absent.
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: Conformance gate (just ci)
        run: just ci

      # Differential fidelity gate: the Lean ACL2-logic interpreter vs real
      # ACL2 over Tests/differential/. Separate step so a fidelity divergence
      # reads distinctly from a build/proof failure. ACL2 is already built
      # (the capture step above used it). `unsupported`/`known-bug`/`refuse`
      # entries keep this green while documenting the not-yet-faithful surface;
      # it fails only on a real divergence, regression, or coverage change (see the corpus
      # README). This is the trusted-core acceptance gate the audit practices
      # assume exists.
      - name: Differential gate (Lean interpreter vs ACL2)
        run: just diff-test
